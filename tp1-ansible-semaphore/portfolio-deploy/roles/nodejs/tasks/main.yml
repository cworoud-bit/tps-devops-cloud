---
- name: Ajouter le dépôt NodeSource
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ node_major }}.x"
    suites: nodistro
    components: main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present
  register: nodesource_repo

- name: Mettre à jour le cache apt si le dépôt a changé
  ansible.builtin.apt:
    update_cache: true
  when: nodesource_repo.changed

- name: Installer Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Installer PM2 globalement
  community.general.npm:
    name: pm2
    global: true
    state: present
