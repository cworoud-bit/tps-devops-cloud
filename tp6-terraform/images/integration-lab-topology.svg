<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>TP d'intégration : Vagrant crée 2 VM, Ansible installe Docker et Terraform, Terraform lance le conteneur CV sur les ports 8001 et 8002, reverse proxy nginx en option</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="820" height="480" rx="12" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">TP d'intégration : Vagrant → Ansible → Terraform → Docker</text>

  <!-- pipeline strip -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="52" width="180" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="110" y="72" fill="#4c1d95">① Vagrant</text>
    <text x="110" y="89" font-size="11" font-weight="400" fill="#4c1d95">crée 2 VM</text>
    <rect x="230" y="52" width="180" height="46" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="320" y="72" fill="#7c2d12">② Ansible</text>
    <text x="320" y="89" font-size="11" font-weight="400" fill="#7c2d12">installe docker + terraform</text>
    <rect x="440" y="52" width="180" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="530" y="72" fill="#4c1d95">③ Terraform</text>
    <text x="530" y="89" font-size="11" font-weight="400" fill="#4c1d95">crée les conteneurs</text>
    <rect x="650" y="52" width="150" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="725" y="72" fill="#1e3a8a">④ Docker Hub</text>
    <text x="725" y="89" font-size="11" font-weight="400" fill="#1e3a8a">&lt;user&gt;/cv-onepage</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#arr)">
    <line x1="200" y1="75" x2="228" y2="75"/>
    <line x1="410" y1="75" x2="438" y2="75"/>
    <line x1="620" y1="75" x2="648" y2="75"/>
  </g>

  <!-- Lab VM -->
  <rect x="20" y="120" width="780" height="345" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="40" y="145" font-size="14" font-weight="700" fill="#0f172a">VM de lab : Ubuntu Server 26.04 (VirtualBox + Vagrant + Ansible)</text>

  <!-- Reverse proxy -->
  <rect x="40" y="165" width="210" height="140" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="145" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Défi</text>
  <text x="145" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">nginx reverse proxy</text>
  <text x="145" y="232" text-anchor="middle" font-size="11" fill="#713f12">point d'entrée unique :80</text>
  <text x="145" y="250" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#713f12">upstream cv {</text>
  <text x="145" y="266" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#713f12"> vm1:8001; vm2:8002; }</text>
  <text x="145" y="288" text-anchor="middle" font-size="10.5" fill="#713f12">(répartit la charge sur les 2 VM)</text>

  <rect x="40" y="330" width="210" height="115" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="145" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Utilisateur / navigateur</text>
  <g font-family="Consolas, monospace" font-size="11" fill="#2563eb">
    <text x="55" y="380">http://vm1:8001</text>
    <text x="55" y="400">http://vm2:8002</text>
    <text x="55" y="420">http://proxy/  (défi)</text>
  </g>
  <line x1="145" y1="328" x2="145" y2="307" stroke="#ca8a04" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- VM1 -->
  <rect x="290" y="165" width="490" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="310" y="190" font-size="14" font-weight="700" fill="#14532d">VM Vagrant 1 : Ubuntu 24.04</text>
  <g font-size="12" font-weight="600" fill="#0f172a">
    <rect x="310" y="205" width="120" height="70" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="370" y="232" text-anchor="middle">docker</text>
    <text x="370" y="254" text-anchor="middle">terraform</text>
    <rect x="450" y="205" width="310" height="70" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="605" y="230" text-anchor="middle" fill="#1e3a8a">conteneur : CV One Page (nginx)</text>
    <text x="605" y="254" text-anchor="middle" font-size="13" fill="#14532d">hôte :8001 → conteneur :80</text>
  </g>

  <!-- VM2 -->
  <rect x="290" y="315" width="490" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="310" y="340" font-size="14" font-weight="700" fill="#14532d">VM Vagrant 2 : Ubuntu 24.04</text>
  <g font-size="12" font-weight="600" fill="#0f172a">
    <rect x="310" y="355" width="120" height="70" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="370" y="382" text-anchor="middle">docker</text>
    <text x="370" y="404" text-anchor="middle">terraform</text>
    <rect x="450" y="355" width="310" height="70" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="605" y="380" text-anchor="middle" fill="#1e3a8a">conteneur : CV One Page (nginx)</text>
    <text x="605" y="404" text-anchor="middle" font-size="13" fill="#14532d">hôte :8002 → conteneur :80</text>
  </g>

  <g stroke="#ca8a04" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)">
    <path d="M250,230 L288,230"/>
    <path d="M250,280 C272,280 268,380 288,380"/>
  </g>
</svg>
