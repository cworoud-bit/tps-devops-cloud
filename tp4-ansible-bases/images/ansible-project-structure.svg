<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Organisation d'un projet Ansible et liens entre playbooks, rôles, tâches et modules</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="820" height="470" rx="12" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Organisation d'un projet Ansible</text>

  <!-- Left: directory tree -->
  <rect x="30" y="55" width="340" height="395" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="82" font-size="14" font-weight="700" fill="#334155">Sur disque (versionné dans Git)</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#0f172a">
    <text x="50" y="112">demo1/</text>
    <text x="50" y="134">├──&#160;ansible.cfg</text>
    <text x="50" y="156">├──&#160;inventory.txt</text>
    <text x="50" y="178">├──&#160;group_vars/</text>
    <text x="50" y="200">│&#160;&#160;&#160;└──&#160;webserver.yml</text>
    <text x="50" y="222">├──&#160;site.yml&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#2563eb">← playbook</tspan></text>
    <text x="50" y="244">└──&#160;roles/</text>
    <text x="50" y="266">&#160;&#160;&#160;&#160;└──&#160;jenkins_install/</text>
    <text x="50" y="288">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;├──&#160;tasks/main.yml</text>
    <text x="50" y="310">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;├──&#160;handlers/main.yml</text>
    <text x="50" y="332">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;├──&#160;templates/</text>
    <text x="50" y="354">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;├──&#160;files/</text>
    <text x="50" y="376">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;├──&#160;vars/main.yml</text>
    <text x="50" y="398">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;└──&#160;defaults/main.yml</text>
  </g>
  <text x="50" y="432" font-size="12" fill="#475569">astuce : ansible-galaxy role init roles/jenkins_install</text>

  <!-- Right: logical hierarchy -->
  <text x="595" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">À l'exécution</text>

  <rect x="455" y="98" width="280" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="595" y="119" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Playbook (site.yml)</text>
  <text x="595" y="137" text-anchor="middle" font-size="11" fill="#1e3a8a">un ou plusieurs plays</text>

  <rect x="455" y="176" width="280" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="595" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Play</text>
  <text x="595" y="215" text-anchor="middle" font-size="11" fill="#4c1d95">hosts: webserver · become: true</text>

  <rect x="455" y="254" width="280" height="48" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="595" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">Rôles</text>
  <text x="595" y="293" text-anchor="middle" font-size="11" fill="#7c2d12">tâches + fichiers réutilisables</text>

  <rect x="455" y="332" width="280" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Tâches (de haut en bas)</text>
  <text x="595" y="371" text-anchor="middle" font-size="11" fill="#14532d">- name: Install Apache</text>

  <rect x="455" y="410" width="280" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="595" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Modules : ansible.builtin.apt, copy…</text>

  <g stroke="#334155" stroke-width="2" marker-end="url(#arr)">
    <line x1="595" y1="146" x2="595" y2="174"/>
    <line x1="595" y1="224" x2="595" y2="252"/>
    <line x1="595" y1="302" x2="595" y2="330"/>
    <line x1="595" y1="380" x2="595" y2="408"/>
  </g>
  <g font-size="11" fill="#475569">
    <text x="745" y="164">contient</text>
    <text x="745" y="242">inclut</text>
    <text x="745" y="320">contiennent</text>
    <text x="745" y="398">appellent</text>
  </g>

  <!-- link tree to runtime -->
  <path d="M300,222 C390,222 400,122 453,122" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M232,262 C360,262 380,278 453,278" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
</svg>
