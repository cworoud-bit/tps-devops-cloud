  <text x="460" y="150" text-anchor="middle" font-size="11" fill="#7f1d1d">SSH + rôles</text>

  <!-- Target -->
  <rect x="565" y="50" width="175" height="200" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="652" y="73" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Serveur Ubuntu</text>
  <rect x="580" y="88" width="145" height="34" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="652" y="110" text-anchor="middle" font-size="12" fill="#14532d">Nginx :80 (proxy)</text>
  <rect x="580" y="132" width="145" height="34" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="652" y="154" text-anchor="middle" font-size="12" fill="#14532d">Next.js :3000 (PM2)</text>
  <rect x="580" y="176" width="145" height="34" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="652" y="198" text-anchor="middle" font-size="12" fill="#14532d">Node.js 20</text>
  <text x="652" y="236" text-anchor="middle" font-size="11" fill="#14532d">utilisateur : deploy</text>

  <!-- arrows -->
  <line x1="155" y1="135" x2="203" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="355" y1="135" x2="403" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="515" y1="135" x2="563" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="180" y="125" text-anchor="middle" font-size="10" fill="#475569">clone</text>
  <text x="380" y="125" text-anchor="middle" font-size="10" fill="#475569">lance</text>
  <text x="540" y="125" text-anchor="middle" font-size="10" fill="#475569">SSH</text>

  <!-- Browser -->
  <rect x="565" y="262" width="175" height="30" rx="8" fill="#e2e8f0" stroke="#475569"/>
  <text x="652" y="282" text-anchor="middle" font-size="12" fill="#0f172a">Navigateur → http://IP</text>
