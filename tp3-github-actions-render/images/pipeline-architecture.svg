<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="860" height="300" fill="#f8fafc" rx="12"/>
  <text x="430" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">CI/CD pipeline: GitHub Actions verifies, Render deploys</text>

  <g text-anchor="middle" font-size="13" font-weight="bold">
    <!-- Developer -->
    <rect x="20" y="80" width="140" height="110" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="90" y="108" fill="#78350f">Developer</text>
    <text x="90" y="130" font-size="10" font-weight="normal" fill="#78350f">local machine</text>
    <text x="90" y="148" font-size="10" font-weight="normal" fill="#78350f" font-family="Consolas, monospace">npm run verify</text>
    <text x="90" y="166" font-size="10" font-weight="normal" fill="#78350f" font-family="Consolas, monospace">git push</text>

    <!-- GitHub -->
    <rect x="215" y="80" width="150" height="110" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <text x="290" y="108" fill="#0f172a">GitHub</text>
    <text x="290" y="130" font-size="10" font-weight="normal" fill="#0f172a">feature branch → PR</text>
    <text x="290" y="148" font-size="10" font-weight="normal" fill="#0f172a">ruleset «Protect main»</text>
    <text x="290" y="166" font-size="10" font-weight="normal" fill="#0f172a">merge → main</text>

    <!-- GitHub Actions -->
    <rect x="420" y="80" width="150" height="110" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="495" y="108" fill="#1e3a8a">GitHub Actions</text>
    <text x="495" y="130" font-size="10" font-weight="normal" fill="#1e3a8a">workflow CI · job Verify</text>
    <text x="495" y="148" font-size="10" font-weight="normal" fill="#1e3a8a">typecheck · test · build</text>
    <text x="495" y="166" font-size="10" font-weight="normal" fill="#1e3a8a">status check ✓ / ✗</text>

    <!-- Render -->
    <rect x="625" y="80" width="150" height="110" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
    <text x="700" y="108" fill="#14532d">Render</text>
    <text x="700" y="130" font-size="10" font-weight="normal" fill="#14532d">Web Service (Node)</text>
    <text x="700" y="148" font-size="10" font-weight="normal" fill="#14532d">After CI Checks Pass</text>
    <text x="700" y="166" font-size="10" font-weight="normal" fill="#14532d">health: /api/health</text>
  </g>

  <!-- arrows -->
  <line x1="160" y1="135" x2="212" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="365" y1="120" x2="417" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="391" y="112" text-anchor="middle" font-size="9" fill="#475569">trigger</text>
  <line x1="417" y1="152" x2="368" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="391" y="168" text-anchor="middle" font-size="9" fill="#475569">result</text>
  <line x1="570" y1="135" x2="622" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="594" y="124" text-anchor="middle" font-size="9" fill="#475569">main ✓</text>

  <!-- public URL -->
  <rect x="790" y="110" width="55" height="50" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text x="817" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c2d12">Public</text>
  <text x="817" y="146" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c2d12">URL</text>
  <line x1="775" y1="135" x2="788" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- legend -->
  <g font-size="11" fill="#334155">
    <text x="20" y="232">• Pull request → CI runs Verify; the ruleset blocks the merge while Verify fails.</text>
    <text x="20" y="252">• Push to main → CI runs again; Render deploys only once the checks of that commit pass.</text>
    <text x="20" y="272">• Pull request (optional) → Render creates a temporary preview with its own URL.</text>
  </g>
</svg>
