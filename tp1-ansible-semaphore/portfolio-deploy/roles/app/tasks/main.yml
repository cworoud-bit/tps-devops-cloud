---
- name: Créer le dossier de l'application
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Cloner le dépôt
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_version }}"
  become_user: "{{ app_user }}"
  register: app_git

- name: Installer les dépendances (npm ci)
  ansible.builtin.command: npm ci
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  when: app_git.changed

- name: Build de l'application
  ansible.builtin.command: npm run build
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  when: app_git.changed
  notify: restart app

- name: Vérifier si l'app existe dans PM2
  ansible.builtin.command: pm2 describe portfolio
  become_user: "{{ app_user }}"
  register: pm2_status
  changed_when: false
  failed_when: false

- name: Démarrer l'application avec PM2
  ansible.builtin.command: pm2 start npm --name portfolio -- start
  args:
    chdir: "{{ app_dir }}"
  environment:
    PORT: "{{ app_port }}"
  become_user: "{{ app_user }}"
  when: pm2_status.rc != 0
