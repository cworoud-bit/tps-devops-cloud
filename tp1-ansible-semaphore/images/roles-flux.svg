<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="270" fill="#f8fafc" rx="12"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Ordre d'exécution des rôles et handlers</text>

  <g text-anchor="middle" font-size="13" font-weight="bold">
    <rect x="25" y="55" width="150" height="70" rx="10" fill="#e9d5ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="100" y="82" fill="#581c87">common</text>
    <text x="100" y="102" font-size="10" font-weight="normal" fill="#581c87">apt · git · user deploy</text>

    <rect x="205" y="55" width="150" height="70" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="280" y="82" fill="#1e3a8a">nodejs</text>
    <text x="280" y="102" font-size="10" font-weight="normal" fill="#1e3a8a">Node 20 · PM2</text>

    <rect x="385" y="55" width="150" height="70" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
    <text x="460" y="82" fill="#14532d">app</text>
    <text x="460" y="102" font-size="10" font-weight="normal" fill="#14532d">git · npm ci · build</text>

    <rect x="565" y="55" width="170" height="70" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <text x="650" y="82" fill="#7c2d12">nginx</text>
    <text x="650" y="102" font-size="10" font-weight="normal" fill="#7c2d12">template Jinja2 · vhost</text>
  </g>
  <line x1="175" y1="90" x2="203" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="355" y1="90" x2="383" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="535" y1="90" x2="563" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- handlers -->
  <g text-anchor="middle" font-size="11">
    <rect x="385" y="160" width="150" height="34" rx="6" fill="#ffffff" stroke="#15803d" stroke-dasharray="5,3"/>
    <text x="460" y="182" fill="#14532d">handler : restart app</text>
    <rect x="565" y="160" width="170" height="34" rx="6" fill="#ffffff" stroke="#c2410c" stroke-dasharray="5,3"/>
    <text x="650" y="182" fill="#7c2d12">handler : reload nginx</text>
  </g>
  <line x1="460" y1="125" x2="460" y2="158" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <line x1="650" y1="125" x2="650" y2="158" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="520" y="148" font-size="10" fill="#475569">notify si « changed »</text>

  <!-- idempotence -->
  <rect x="25" y="215" width="330" height="40" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="190" y="240" text-anchor="middle" font-size="12" fill="#78350f">1ʳᵉ exécution : changed=N (installation)</text>
  <rect x="385" y="215" width="350" height="40" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="560" y="240" text-anchor="middle" font-size="12" fill="#14532d">2ᵉ exécution : changed=0 (idempotence)</text>
</svg>
