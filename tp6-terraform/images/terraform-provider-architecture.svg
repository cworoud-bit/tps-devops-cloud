<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Le provider Docker de Terraform pilote un démon Docker local ou distant via SSH</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="820" height="400" rx="12" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Comment Terraform pilote Docker</text>

  <!-- Terraform -->
  <rect x="20" y="60" width="240" height="320" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="140" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Machine Terraform</text>
  <rect x="40" y="105" width="200" height="50" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="140" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Terraform CLI (core)</text>
  <text x="140" y="144" text-anchor="middle" font-size="11" fill="#475569">lit les .tf, graphe, état</text>
  <rect x="40" y="185" width="200" height="60" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="140" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">kreuzwerker/docker</text>
  <text x="140" y="224" text-anchor="middle" font-size="11" fill="#475569">plugin provider (~&gt; 3.0)</text>
  <text x="140" y="238" text-anchor="middle" font-size="11" fill="#475569">téléchargé par terraform init</text>
  <line x1="140" y1="157" x2="140" y2="183" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="148" y="174" font-size="10.5" fill="#475569">gRPC</text>
  <rect x="40" y="275" width="200" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="296" font-size="11.5" font-weight="700" fill="#0f172a">provider "docker" { host = … }</text>
  <g font-family="Consolas, monospace" font-size="10.5" fill="#0f172a">
    <text x="52" y="318">(vide) → socket local</text>
    <text x="52" y="338">"ssh://user@devopslab:22"</text>
    <text x="52" y="355" fill="#475569">  → démon distant</text>
  </g>

  <!-- local -->
  <rect x="380" y="60" width="420" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="86" font-size="14" font-weight="700" fill="#1e3a8a">A · Docker local (même machine)</text>
  <rect x="400" y="100" width="150" height="80" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="475" y="125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">dockerd</text>
  <text x="475" y="143" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#475569">/var/run/docker.sock</text>
  <rect x="580" y="100" width="200" height="80" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="680" y="125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">nginx_terraform</text>
  <text x="680" y="145" text-anchor="middle" font-size="11" fill="#14532d">image: nginx:latest</text>
  <text x="680" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">hôte :8001 → conteneur :80</text>
  <line x1="550" y1="140" x2="578" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- remote -->
  <rect x="380" y="230" width="420" height="150" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="256" font-size="14" font-weight="700" fill="#7c2d12">B · Docker distant : VM « devopslab »</text>
  <rect x="400" y="275" width="150" height="85" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="475" y="300" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">sshd → dockerd</text>
  <text x="475" y="320" text-anchor="middle" font-size="10.5" fill="#475569">membre du groupe docker,</text>
  <text x="475" y="336" text-anchor="middle" font-size="10.5" fill="#475569">clé SSH, sans mot de passe</text>
  <rect x="580" y="275" width="200" height="85" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="680" y="302" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">nginx_terraform</text>
  <text x="680" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">devopslab:8001 → :80</text>
  <line x1="550" y1="318" x2="578" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M240,205 C310,205 320,140 398,140"/>
    <path d="M240,225 C310,225 320,318 398,318" stroke="#ea580c"/>
  </g>
  <text x="318" y="160" text-anchor="middle" font-size="11" fill="#1e3a8a">socket unix</text>
  <text x="318" y="292" text-anchor="middle" font-size="11" fill="#7c2d12">tunnel SSH</text>
</svg>
