<svg viewBox="0 0 760 350" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#f8fafc" rx="12"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Architecture du TP2 : Forgejo + Coolify dans une VM locale</text>

  <!-- student PC -->
  <rect x="15" y="100" width="130" height="100" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="80" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Poste étudiant</text>
  <text x="80" y="148" text-anchor="middle" font-size="10" fill="#0f172a">git push</text>
  <text x="80" y="164" text-anchor="middle" font-size="10" fill="#0f172a">+ navigateur</text>
  <text x="80" y="180" text-anchor="middle" font-size="10" fill="#0f172a">+ fichier hosts</text>

  <!-- VM -->
  <rect x="175" y="48" width="570" height="262" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <text x="460" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f766e">VM Ubuntu locale (Docker)</text>

  <rect x="190" y="92" width="150" height="80" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="265" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">Forgejo</text>
  <text x="265" y="138" text-anchor="middle" font-size="10" fill="#78350f">dépôt « portfolio »</text>
  <text x="265" y="154" text-anchor="middle" font-size="10" fill="#78350f">port 3001</text>

  <rect x="395" y="92" width="145" height="80" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="467" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#134e4a">Coolify</text>
  <text x="467" y="138" text-anchor="middle" font-size="10" fill="#134e4a">dashboard :8000</text>
  <text x="467" y="154" text-anchor="middle" font-size="10" fill="#134e4a">build · deploy</text>

  <rect x="595" y="92" width="135" height="80" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text x="662" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Traefik :80</text>
  <text x="662" y="138" text-anchor="middle" font-size="10" fill="#7c2d12">routage par</text>
  <text x="662" y="154" text-anchor="middle" font-size="10" fill="#7c2d12">nom d'hôte</text>

  <rect x="395" y="222" width="145" height="70" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="467" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Conteneur Next.js</text>
  <text x="467" y="268" text-anchor="middle" font-size="10" fill="#14532d">port interne 3000</text>

  <!-- arrows -->
  <line x1="145" y1="130" x2="188" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="166" y="122" text-anchor="middle" font-size="10" fill="#475569">push</text>

  <line x1="342" y1="112" x2="393" y2="112" stroke="#b91c1c" stroke-width="2" marker-end="url(#a)"/>
  <text x="367" y="104" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">webhook</text>

  <line x1="393" y1="152" x2="342" y2="152" stroke="#475569" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="367" y="168" text-anchor="middle" font-size="10" fill="#475569">git clone</text>

  <line x1="467" y1="172" x2="467" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="520" y="200" text-anchor="middle" font-size="10" fill="#475569">build + run</text>

  <path d="M625,172 L625,257 L542,257" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M80,200 L80,332 L700,332 L700,174" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="390" y="326" text-anchor="middle" font-size="10" fill="#475569">http://portfolio.coolify.local (port 80)</text>
