---
- name: Installer Jenkins, Docker, Portainer et un conteneur web (playbook simple)
  hosts: nodes
  become: true

  vars:
    jenkins_java_package: openjdk-21-jre-headless
    jenkins_key_url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    jenkins_port: 8080
    portainer_image: portainer/portainer-ce:lts
    portainer_http_port: 9000
    portainer_https_port: 9443
    app_dir: /opt/demo-web
    web_port: 8081

  tasks:
    - name: Installer Java et les prérequis (Java avant Jenkins)
      ansible.builtin.apt:
        name:
          - "{{ jenkins_java_package }}"
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Créer le dossier des clés apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Télécharger la clé GPG du dépôt Jenkins
      ansible.builtin.get_url:
        url: "{{ jenkins_key_url }}"
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Ajouter le dépôt Jenkins (LTS)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        state: present
        filename: jenkins

    - name: Installer Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true

    - name: Démarrer et activer Jenkins au boot
      ansible.builtin.service:
        name: jenkins
        state: started
        enabled: true

    - name: Attendre que Jenkins écoute sur son port
      ansible.builtin.wait_for:
        port: "{{ jenkins_port }}"
        timeout: 180

    - name: Installer les prérequis Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Créer le dossier des clés apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Télécharger la clé GPG officielle de Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Ajouter le dépôt Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_facts['distribution_release'] }} stable
        state: present
        filename: docker

    - name: Installer Docker Engine, plugin Compose et module Python Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - python3-docker
        state: present
        update_cache: true

    - name: Démarrer et activer Docker au boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ajouter l'utilisateur au groupe docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Lancer Portainer
      community.docker.docker_container:
        name: portainer
        image: "{{ portainer_image }}"
        state: started
        restart_policy: always
        ports:
          - "{{ portainer_http_port }}:9000"
          - "{{ portainer_https_port }}:9443"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - portainer_data:/data

    - name: Créer le dossier de l'application
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copier Dockerfile, index.html et docker-compose.yml
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - Dockerfile
        - index.html
        - docker-compose.yml

    - name: Construire l'image et démarrer le conteneur avec Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present

    - name: Tester l'accès au site web conteneurisé
      ansible.builtin.uri:
        url: "http://localhost:{{ web_port }}"
        return_content: true
      register: web_check
      retries: 10
      delay: 3
      until: web_check.status == 200
      changed_when: false
