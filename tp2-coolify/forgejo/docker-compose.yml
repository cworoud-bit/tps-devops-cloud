# Forgejo : forge Git auto-hébergée (alternative légère à GitHub), dans la même VM que Coolify.
# Lancer :  docker compose up -d
# Interface : http://<IP-VM>:3001
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16   # si codeberg.org est injoignable : data.forgejo.org/forgejo/forgejo:16
    container_name: forgejo
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # Par défaut Forgejo refuse d'appeler une adresse privée avec un webhook.
      # Coolify est sur la même VM (IP privée) : on l'autorise explicitement.
      - FORGEJO__webhook__ALLOWED_HOST_LIST=external,private
    volumes:
      - forgejo-data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3001:3000"   # interface web (3000 est réservé à l'application Next.js)
      - "2222:22"     # SSH Git (utile pour le bonus « dépôt privé »)

volumes:
  forgejo-data:
