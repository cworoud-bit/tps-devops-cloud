<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Topologie cible du TP Vagrant + Ansible : deux VM provisionnées avec Jenkins, Docker, Portainer et le conteneur web</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="820" height="440" rx="12" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Lab cible : Vagrant crée, Ansible configure</text>

  <rect x="20" y="55" width="780" height="370" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="40" y="80" font-size="14" font-weight="700" fill="#1e3a8a">VM de lab (Ubuntu 26.04)</text>

  <rect x="40" y="95" width="230" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="155" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Vagrantfile</text>
  <text x="155" y="140" text-anchor="middle" font-size="11" fill="#4c1d95">2 machines · box · réseau · CPU/RAM</text>
  <text x="155" y="155" text-anchor="middle" font-size="11" fill="#4c1d95">config.vm.provision "ansible"</text>

  <rect x="40" y="185" width="230" height="70" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="155" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">playbook.yml</text>
  <text x="155" y="230" text-anchor="middle" font-size="11" fill="#7c2d12">roles: jenkins · docker/portainer</text>
  <text x="155" y="245" text-anchor="middle" font-size="11" fill="#7c2d12">· container_deployment</text>
  <line x1="155" y1="167" x2="155" y2="183" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="40" y="280" width="230" height="125" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="155" y="302" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Tests (VM de lab / PC)</text>
  <g font-family="Consolas, monospace" font-size="11" fill="#0f172a">
    <text x="52" y="325">curl http://192.168.56.11</text>
    <text x="52" y="345">curl http://192.168.56.12</text>
    <text x="52" y="365">Jenkins   → :8080</text>
    <text x="52" y="385">Portainer → :9443</text>
  </g>

  <!-- VMs -->
  <g>
    <rect x="320" y="95" width="460" height="145" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="340" y="120" font-size="14" font-weight="700" fill="#14532d">vm1: 192.168.56.11 (private_network)</text>
    <g font-size="12" font-weight="600" fill="#0f172a">
      <rect x="340" y="135" width="130" height="36" rx="6" fill="#ffffff" stroke="#86efac"/>
      <text x="405" y="158" text-anchor="middle">Jenkins :8080</text>
      <rect x="480" y="135" width="130" height="36" rx="6" fill="#ffffff" stroke="#86efac"/>
      <text x="545" y="158" text-anchor="middle">Docker Engine</text>
      <rect x="620" y="135" width="140" height="36" rx="6" fill="#ffffff" stroke="#86efac"/>
      <text x="690" y="158" text-anchor="middle">Portainer :9443</text>
      <rect x="480" y="182" width="280" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-dasharray="4 3"/>
      <text x="620" y="207" text-anchor="middle">conteneur web (compose) :80</text>
    </g>

    <rect x="320" y="260" width="460" height="145" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="340" y="285" font-size="14" font-weight="700" fill="#14532d">vm2: 192.168.56.12 (private_network)</text>
    <g font-size="12" font-weight="600" fill="#0f172a">
      <rect x="340" y="300" width="130" height="36" rx="6" fill="#ffffff" stroke="#86efac"/>
      <text x="405" y="323" text-anchor="middle">Jenkins :8080</text>
      <rect x="480" y="300" width="130" height="36" rx="6" fill="#ffffff" stroke="#86efac"/>
      <text x="545" y="323" text-anchor="middle">Docker Engine</text>
      <rect x="620" y="300" width="140" height="36" rx="6" fill="#ffffff" stroke="#86efac"/>
      <text x="690" y="323" text-anchor="middle">Portainer :9443</text>
      <rect x="480" y="347" width="280" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-dasharray="4 3"/>
      <text x="620" y="372" text-anchor="middle">conteneur web (compose) :80</text>
    </g>
  </g>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M272,130 L318,130"/>
    <path d="M272,205 L318,205"/>
    <path d="M272,220 C300,220 295,300 318,300"/>
  </g>
  <text x="296" y="122" text-anchor="middle" font-size="10" fill="#475569">crée</text>
  <text x="300" y="262" text-anchor="end" font-size="10" fill="#475569">SSH</text>
</svg>
