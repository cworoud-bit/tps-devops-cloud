<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Flux de travail Terraform : écrire, init, validate, plan, apply, destroy, avec le fichier d'état</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="820" height="420" rx="12" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Flux de travail Terraform</text>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="20" y="60" width="130" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="85" y="90" fill="#4c1d95">Écrire</text>
    <text x="85" y="110" font-size="11" font-weight="400" fill="#4c1d95">main.tf, variables.tf</text>

    <rect x="180" y="60" width="130" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="245" y="90" fill="#0f172a">init</text>
    <text x="245" y="110" font-size="11" font-weight="400" fill="#475569">charge les providers</text>

    <rect x="340" y="60" width="130" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="405" y="90" fill="#0f172a">fmt · validate</text>
    <text x="405" y="110" font-size="11" font-weight="400" fill="#475569">style + syntaxe</text>

    <rect x="500" y="60" width="130" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="565" y="90" fill="#1e3a8a">plan</text>
    <text x="565" y="110" font-size="11" font-weight="400" fill="#1e3a8a">aperçu des écarts</text>

    <rect x="660" y="60" width="140" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="730" y="90" fill="#14532d">apply</text>
    <text x="730" y="110" font-size="11" font-weight="400" fill="#14532d">crée / modifie / détruit</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#arr)">
    <line x1="150" y1="95" x2="178" y2="95"/>
    <line x1="310" y1="95" x2="338" y2="95"/>
    <line x1="470" y1="95" x2="498" y2="95"/>
    <line x1="630" y1="95" x2="658" y2="95"/>
  </g>

  <!-- init detail -->
  <rect x="180" y="150" width="130" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="245" y="172" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#0f172a">.terraform/</text>
  <text x="245" y="190" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#0f172a">.terraform.lock.hcl</text>
  <text x="245" y="208" text-anchor="middle" font-size="10.5" fill="#475569">depuis registry.terraform.io</text>
  <line x1="245" y1="132" x2="245" y2="148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- plan compares -->
  <rect x="420" y="240" width="190" height="70" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="515" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">terraform.tfstate</text>
  <text x="515" y="286" text-anchor="middle" font-size="11" fill="#713f12">ce que Terraform a déjà créé</text>
  <text x="515" y="301" text-anchor="middle" font-size="11" fill="#713f12">ni modifier, ni commiter</text>

  <rect x="650" y="240" width="150" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="725" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Ressources réelles</text>
  <text x="725" y="286" text-anchor="middle" font-size="11" fill="#475569">image Docker,</text>
  <text x="725" y="301" text-anchor="middle" font-size="11" fill="#475569">conteneur, VM, cloud…</text>

  <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M730,132 L730,238"/>
    <path d="M700,132 C680,200 600,200 560,238"/>
    <path d="M520,238 L540,132" stroke-dasharray="5 4"/>
  </g>
  <text x="738" y="190" font-size="10.5" fill="#475569">via l'API</text>
  <text x="625" y="188" font-size="10.5" fill="#475569">enregistre</text>
  <text x="468" y="190" font-size="10.5" fill="#475569">lit</text>

  <!-- legend of plan symbols -->
  <rect x="20" y="245" width="370" height="155" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="35" y="268" font-size="13" font-weight="700" fill="#0f172a">plan = souhaité (.tf)  vs  actuel (state)</text>
  <g font-family="Consolas, monospace" font-size="12.5">
    <text x="35" y="294" fill="#16a34a">+ création</text>
    <text x="35" y="314" fill="#ca8a04">~ modification sur place</text>
    <text x="35" y="334" fill="#dc2626">- suppression</text>
    <text x="35" y="354" fill="#7c3aed">-/+ suppression puis recréation</text>
  </g>
  <text x="35" y="384" font-size="11.5" fill="#475569">2 apply de suite ⇒ « No changes » (idempotent)</text>

  <!-- destroy -->
  <rect x="420" y="335" width="380" height="65" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="362" font-size="14" font-weight="700" fill="#7f1d1d">terraform destroy</text>
  <text x="440" y="383" font-size="11.5" fill="#7f1d1d">supprime toutes les ressources listées dans l'état</text>
</svg>
