<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#f8fafc" rx="12"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Architecture cible du TP</text>

  <!-- Git -->
  <rect x="25" y="90" width="130" height="90" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="90" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">Dépôt Git</text>
  <text x="90" y="145" text-anchor="middle" font-size="11" fill="#78350f">playbook Ansible</text>
  <text x="90" y="161" text-anchor="middle" font-size="11" fill="#78350f">+ code Next.js</text>

  <!-- Semaphore -->
  <rect x="205" y="90" width="150" height="90" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
