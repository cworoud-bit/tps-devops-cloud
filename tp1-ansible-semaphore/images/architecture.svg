  <text x="280" y="145" text-anchor="middle" font-size="11" fill="#1e3a8a">Template · Inventaire</text>
  <text x="280" y="161" text-anchor="middle" font-size="11" fill="#1e3a8a">Key Store · Logs</text>

  <!-- Ansible -->
  <rect x="405" y="90" width="110" height="90" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
